<!DOCTYPE html>
<html lang="es" class="js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 Album Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Bebas Neue"', 'sans-serif'],
                        body: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14161a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #101215;
            --surface: #181b20;
            --surface-alt: #1e222a;
            --border: rgba(255,255,255,0.06);
            --text: #e4e2dc;
            --text-dim: #82807a;
            --text-muted: #545350;
            --accent: #d4a843;
            --accent-rgb: 212,168,67;
            --owned: #3eb874;
            --owned-rgb: 62,184,116;
            --owned-active-bg: rgba(62,184,116,0.12);
            --owned-active-border: rgba(62,184,116,0.35);
            --alert: #e05560;
            --alert-rgb: 224,85,96;
            --emblem: #e09864;
            --emblem-dim: #70503a;
            --emblem-rgb: 224,152,100;
            --team: #7aa2d4;
            --team-dim: #3d5678;
            --team-rgb: 122,162,212;
            --btn-text: #b0ada5;
            --btn-bg: rgba(255,255,255,0.04);
            --btn-border: rgba(255,255,255,0.1);
            --counter-bg: rgba(255,255,255,0.03);
            --counter-border: rgba(255,255,255,0.06);
            --bar-bg: rgba(0,0,0,0.55);
            --dup-bg: rgba(224,85,96,0.1);
            --dup-border: rgba(224,85,96,0.18);
            --card-owned-bg: #19241c;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        main { position: relative; z-index: 1; }

        /* ── Sticker Cards ── */
        .card-missing {
            background: #181a1e;
            border: 1px dashed rgba(255,255,255,0.06);
            color: var(--text-muted);
        }
        .card-missing .sticker-id { color: var(--text-muted); }
        .card-missing .sticker-desc { color: #3d3c38; }

        .card-owned {
            background: var(--card-owned-bg);
            border: 1.5px solid rgba(var(--owned-rgb), 0.45);
            color: var(--text);
            box-shadow: 0 0 6px rgba(var(--owned-rgb), 0.12), 0 1px 2px rgba(0,0,0,0.3);
        }
        .card-owned .sticker-id { color: var(--text); }
        .card-owned .sticker-desc { color: var(--text-dim); }

        .card-owned, .card-missing {
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.2s ease;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        .card-owned:active {
            transform: scale(0.96);
            border-color: var(--owned);
            box-shadow: 0 0 12px rgba(var(--owned-rgb), 0.35), 0 0 0 3px rgba(var(--owned-rgb), 0.15);
        }
        .card-missing:active {
            transform: scale(0.97);
        }
        @media (hover: hover) {
            .card-owned:hover {
                transform: translateY(-1px);
                border-color: var(--owned);
                box-shadow: 0 0 16px rgba(var(--owned-rgb), 0.25), 0 3px 12px rgba(0,0,0,0.5);
            }
        }

        /* ── Progress Bar ── */
        #progress-bar {
            background: var(--owned);
            box-shadow: none;
            border-radius: 3px;
        }

        /* ── Section Headers ── */
        details[open] > summary {
            background: rgba(255,255,255,0.015);
            border-radius: 6px;
        }
        summary { outline: none; }
        summary::-webkit-details-marker { display: none; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

        /* ── Qty Badge ── */
        .qty-badge {
            position: absolute; top: 0.25rem; right: 0.25rem; z-index: 10;
            font-size: 11px; font-weight: 900; letter-spacing: -0.02em;
            color: #fff; background: var(--owned);
            padding: 0.125rem 0.4rem; border-radius: 9999px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            line-height: 1.2;
        }

        /* ── Type Badges ── */
        .type-badge {
            position: absolute; top: 0.375rem; left: 0.375rem;
            font-size: 7px; font-weight: 900; text-transform: uppercase;
            padding: 0.125rem 0.25rem; border-radius: 0.25rem; z-index: 10;
            border: 1px solid transparent;
        }
        .emblem-badge { background: rgba(var(--emblem-rgb), 0.12); color: var(--emblem); border-color: rgba(var(--emblem-rgb), 0.2); }
        .team-badge   { background: rgba(var(--team-rgb), 0.12);   color: var(--team);   border-color: rgba(var(--team-rgb), 0.2); }
        .badge-dim.emblem-badge { background: rgba(var(--emblem-rgb), 0.04); color: var(--emblem-dim); border-color: rgba(var(--emblem-rgb), 0.08); }
        .badge-dim.team-badge   { background: rgba(var(--team-rgb), 0.04);   color: var(--team-dim);   border-color: rgba(var(--team-rgb), 0.08); }

        /* ── Summary badges ── */
        .group-badge {
            font-size: 7px; font-weight: 900; padding: 0.1rem 0.2rem;
            border-radius: 0.25rem; flex-shrink: 0;
            background: rgba(var(--accent-rgb), 0.08); color: var(--accent);
            border: 1px solid rgba(var(--accent-rgb), 0.15);
            transition: all 0.2s ease;
            min-width: 1rem; text-align: center;
            line-height: 1.2;
        }
        .group-badge.stuck {
            font-size: 10px; padding: 0.2rem 0.35rem;
            min-width: 1.4rem;
            border-radius: 0.3rem;
            background: var(--accent); color: var(--bg);
            border-color: var(--accent);
        }
        .dup-badge {
            font-size: 9px; font-weight: 700; padding: 0.125rem 0.375rem;
            border-radius: 0.25rem; white-space: nowrap;
            background: var(--dup-bg); color: var(--alert); border: 1px solid var(--dup-border);
        }
        .counter-badge {
            font-size: 9px; font-weight: 700; padding: 0.125rem 0.375rem;
            border-radius: 9999px; white-space: nowrap; transition: all 0.15s;
            background: var(--counter-bg); color: var(--text-dim); border: 1px solid var(--border);
        }
        .counter-badge.completed {
            background: rgba(var(--owned-rgb), 0.1); color: var(--owned);
            border-color: rgba(var(--owned-rgb), 0.25);
        }

        /* ── Utility ── */
        .hidden-card { display: none !important; }

        /* ── Mobile tap targets ── */
        @media (max-width: 640px) {
            .card-owned button, .card-missing button {
                min-width: 32px;
                min-height: 32px;
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col antialiased">

    <main class="w-full max-w-7xl mx-auto">

        <!-- Header -->
        <div class="border-b border-white/5">
            <div class="flex items-center justify-between p-4 sm:p-6 pb-3 gap-4">

                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 rounded-lg flex items-center justify-center text-lg flex-shrink-0"
                        style="background: var(--surface-alt); border: 1px solid var(--border);">
                        &#9733;
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-display uppercase tracking-wider leading-none" style="letter-spacing: 0.06em;">
                            <span style="color: var(--text);">FIFA</span> <span style="color: var(--accent);">2026</span>
                        </h1>
                        <p class="text-[9px] font-bold uppercase tracking-[0.15em]" style="color: var(--text-dim);">Album Tracker</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="shareStatus()"
                        class="h-9 px-4 text-[10px] font-bold uppercase rounded-lg border transition-all active:scale-95"
                        style="background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-border);">
                        Compartir
                    </button>

                    <div class="h-6 w-[1px] bg-white/8 hidden sm:block mx-1"></div>

                <!-- Menú de Opciones -->
                <div class="relative">
                    <button onclick="toggleMenu(event)" id="btn-menu"
                        class="h-9 w-9 flex items-center justify-center rounded-lg border transition-colors"
                        style="background: var(--surface); border-color: var(--border); color: var(--text-dim);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="5" r="1.5" />
                            <circle cx="12" cy="12" r="1.5" />
                            <circle cx="12" cy="19" r="1.5" />
                        </svg>
                    </button>

                    <!-- Dropdown -->
                    <div id="dropdown-menu"
                        class="hidden absolute right-0 mt-2 w-48 border rounded-xl shadow-2xl z-[100] overflow-hidden" style="background: var(--surface-alt); border-color: var(--border);">
                        <button onclick="showImportModal()"
                            class="w-full flex items-center gap-3 px-4 py-3.5 text-[10px] font-bold uppercase border-b transition-colors text-left" style="border-color: var(--border); color: var(--accent);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                            Importar Datos
                        </button>
                        <button onclick="exportData()"
                            class="w-full flex items-center gap-3 px-4 py-3.5 text-[10px] font-bold uppercase transition-colors text-left" style="color: var(--owned);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                            Exportar Datos
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-3 gap-3 items-start">

            <!-- Progress Card -->
            <div class="flex flex-col gap-2 p-3.5 rounded-2xl border" style="background: var(--surface); border-color: var(--border);">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-bold uppercase tracking-[0.15em]" style="color: var(--text-dim);">Progreso Total</span>
                    <span id="percentage-count" class="text-xl font-display tracking-wider" style="color: var(--owned);">0%</span>
                </div>
                <div class="relative h-2 w-full rounded-full overflow-hidden" style="background: rgba(255,255,255,0.04);">
                    <div id="progress-bar" class="absolute h-full transition-all duration-700 ease-out" style="width: 0%"></div>
                </div>
                <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider" style="color: var(--text-dim);">
                    <span><span id="found-count" style="color: var(--text);">0</span> de <span id="total-count">0</span> únicos</span>
                    <span><span id="physical-count" style="color: var(--accent);">0</span> total</span>
                </div>
            </div>

            <div id="dashboard-stats" class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
        </div>

        <!-- Filter & Sort Bar -->
        <div class="px-4 sm:px-6 mb-4 flex flex-wrap items-center gap-1.5">
            <div class="flex gap-1">
                <button onclick="setFilter('missing')" id="btn-filter-missing"
                    class="h-9 px-2 text-[9px] font-bold uppercase rounded-full border transition-all active:scale-95" style="background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-border);">
                    Falta <span id="btn-missing-val" class="font-black" style="color: var(--text);"></span>
                </button>
                <button onclick="setFilter('owned')" id="btn-filter-owned"
                    class="h-9 px-2 text-[9px] font-bold uppercase rounded-full border transition-all active:scale-95" style="background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-border);">
                    Tengo <span id="btn-owned-val" class="font-black" style="color: var(--text);"></span>
                </button>
                <button onclick="setFilter('duplicates')" id="btn-filter-duplicates"
                    class="h-9 px-2 text-[9px] font-bold uppercase rounded-full border transition-all active:scale-95" style="background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-border);">
                    Repes <span id="btn-duplicates-val" class="font-black" style="color: var(--text);"></span>
                </button>
            </div>

            <button onclick="toggleJumpInput()" id="btn-jump"
                    class="h-9 w-9 sm:w-auto sm:px-3 flex items-center justify-center gap-2 text-[10px] font-bold uppercase rounded-lg border transition-all active:scale-95" style="background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-border);" title="Buscar sección">
                    <span class="hidden sm:inline">Ir a...</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>

                <div class="relative">
                    <button onclick="toggleChangeLog(event)" id="btn-changelog"
                        class="h-9 w-9 flex items-center justify-center rounded-lg border transition-all active:scale-95" style="background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-border);" title="Bitácora de cambios">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </button>
                    <div id="changelog-panel" class="hidden absolute right-0 mt-2 w-56 sm:w-64 border rounded-xl shadow-2xl z-[101] overflow-hidden" style="background: var(--surface-alt); border-color: var(--border); max-width: calc(100vw - 2rem);">
                        <div class="px-3 py-2 border-b flex items-center justify-between" style="border-color: var(--border);">
                            <span class="text-[9px] font-bold uppercase tracking-wider" style="color: var(--text-dim);">Bitácora</span>
                            <span class="text-[8px] font-medium uppercase" style="color: var(--text-muted);">últimos 10</span>
                        </div>
                        <div id="changelog-list" class="max-h-64 overflow-y-auto p-2 flex flex-col gap-1"></div>
                    </div>
                </div>

            <div class="ml-auto flex gap-1">
                <button onclick="toggleSort()" id="btn-sort"
                    class="h-9 w-9 sm:w-auto sm:px-3 flex items-center justify-center gap-2 text-[10px] font-bold uppercase rounded-lg border transition-all active:scale-95" style="background: rgba(196,161,68,0.08); color: var(--accent); border-color: rgba(196,161,68,0.2);" title="Cambiar Orden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-3 3-3-3"/><path d="M12 3v18"/><path d="m9 6 3-3 3 3"/></svg>
                    <span class="hidden sm:inline">Ordenar: Defecto</span>
                </button>
                <button onclick="toggleAllSections()" id="btn-toggle-sections"
                    class="h-9 w-9 sm:w-auto sm:px-3 flex items-center justify-center gap-2 text-[10px] font-bold uppercase rounded-lg border transition-all active:scale-95" style="background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-border);" title="Colapsar/Expandir Todo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
                    <span class="hidden sm:inline">Colapsar Todos</span>
                </button>
            </div>
        </div>


        <div id="album-container" class="px-4 sm:px-6 flex flex-col gap-3 pb-16">
        </div>
    </main>

        <script src="js/data.js" defer></script>
        <script src="js/app.js" defer></script>
    <!-- Modal de Importación -->
    <div id="import-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4" style="background: rgba(10,11,13,0.92); backdrop-filter: blur(12px);">
        <div class="w-full max-w-lg border rounded-2xl shadow-2xl overflow-hidden" style="background: var(--surface-alt); border-color: var(--border);">
            <div class="p-6 border-b" style="border-color: var(--border);">
                <h3 class="text-xl font-display uppercase tracking-wider" style="color: var(--accent);">Importar Colección</h3>
                <p class="text-[10px] uppercase font-bold mt-1" style="color: var(--text-dim);">Pega tu lista de códigos separados por comas</p>
            </div>
            <div class="p-6">
                <textarea id="import-textarea"
                    class="w-full h-48 rounded-xl p-4 text-xs font-mono focus:outline-none transition-colors resize-none"
                    style="background: var(--bg); border: 1px solid var(--border); color: var(--text-dim);"
                    placeholder="FWC1, FWC2, MEX5..."></textarea>
                <div class="mt-4 flex gap-3">
                    <button onclick="processImport()"
                        class="flex-1 h-12 rounded-xl font-bold uppercase text-xs tracking-widest transition-all active:scale-95"
                        style="background: var(--owned); color: #fff;">
                        Procesar Importación
                    </button>
                    <button onclick="closeImportModal()"
                        class="px-6 h-12 rounded-xl font-bold uppercase text-xs tracking-widest transition-all border"
                        style="background: transparent; border-color: var(--border); color: var(--text-dim);">
                        Cancelar
                    </button>
                </div>
            </div>
            <div class="p-4 border-t" style="border-color: var(--border); background: rgba(255,255,255,0.015);">
                <p class="text-[9px] text-center font-bold uppercase" style="color: var(--text-dim);">
                    Esto reemplazará tu colección actual por completo.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
